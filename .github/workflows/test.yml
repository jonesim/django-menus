name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            django: 'Django>=3.2,<4.0'
          - python-version: '3.11'
            django: 'Django>=4.2,<5.0'
          - python-version: '3.12'
            django: 'Django>=5.0,<6.0'
          - python-version: '3.13'
            django: 'Django>=6.0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.django }}" django-ajax-helpers

      - name: Test
        run: python -m django test tests --settings=tests.settings
